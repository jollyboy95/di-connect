name: Build Di-Connect integration preview
on:
  push:
    branches: [main]
    paths: ['_integration/**', '.github/workflows/di-connect-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: di-connect-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target
      - name: Fetch pinned source projects
        run: |
          git clone https://github.com/jollyboy95/d-play-gwm-h7.git dplay
          git -C dplay checkout 3df998919f075bc6e21efb5e8a314347813647a1
          git clone https://github.com/jollyboy95/DiAuto-GWM.git diauto
          git -C diauto checkout f3046721814bff289a78e58f597b45d895efbb95
      - name: Import Android Auto into D-Play
        run: python3 target/_integration/integrate.py
      - name: Commit combined source on the integration branch
        working-directory: target
        run: |
          if git ls-remote --exit-code --heads origin integration/android-auto; then
            git fetch origin integration/android-auto
            git checkout -B integration/android-auto origin/integration/android-auto
          else
            git checkout -b integration/android-auto
          fi
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='_integration' ../dplay/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Import D-Play GWM foundation and Android Auto engine into Di-Connect'
          git push origin integration/android-auto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 ndk;29.0.14206865 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision published upstream CarPlay runtime assets
        env:
          RUNTIME_DIR: ${{ runner.temp }}/diconnect-runtime
        run: |
          python3 - <<'PY'
          import urllib.request, hashlib, zipfile, pathlib, os
          base='https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.21/'
          apk=pathlib.Path(os.environ['RUNNER_TEMP'])/'DiPlay-0.2.21.apk'
          urllib.request.urlretrieve(base+apk.name,apk)
          sums=urllib.request.urlopen(base+'SHA256SUMS.txt').read().decode()
          expected=next(line.split()[0] for line in sums.splitlines() if line.split()[-1].lstrip('*')==apk.name)
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected, 'Upstream APK checksum mismatch'
          out=pathlib.Path(os.environ['RUNTIME_DIR'])/'offline-mfi'
          out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(apk) as z:
              for n in ('identity.pk8','certificate.p7b'):
                  data=z.read('assets/offline-mfi/'+n)
                  assert data, 'Missing runtime asset'
                  (out/n).write_bytes(data)
          PY
          echo "DIPLAY_AUTH_ASSETS_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Set increasing APK revision
        run: echo "DI_CONNECT_REVISION=$(( $(date +%s) - 1767225600 ))" >> "$GITHUB_ENV"
      - name: Unit tests, lint and source builds
        working-directory: target
        run: |
          chmod +x gradlew
          ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :android-auto:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace --no-configuration-cache
      - name: Verify standalone CarPlay build
        working-directory: target
        run: ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :mobile:assembleStandaloneDebug --stacktrace --no-configuration-cache
      - name: Preview APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Di-Connect-preview
          path: |
            target/mobile/build/outputs/apk/debug/*.apk
            target/**/build/reports/tests/
            target/common/build/reports/di-connect-home/
            target/**/build/reports/lint-results-debug.html
