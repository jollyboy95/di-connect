name: Build Di-Connect APK
on:
  # Pull requests (including PR #1 from integration/android-auto) build once through
  # pull_request. Pushing to the PR branch therefore no longer starts a second, identical
  # push run. The preview workflow on main dispatches this workflow after it regenerates
  # the integration branch, because its own bot push cannot start other workflows.
  push:
    branches: [main]
    paths-ignore: ['_integration/**', '**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: di-connect-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # Explicit bash adds pipefail, so a Gradle failure piped through tee still fails its step.
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    env:
      # -PgwmLintFast applies DiAuto-GWM's own fast lint check set to the Android Auto module only.
      GRADLE_ARGS: --stacktrace --no-configuration-cache --profile --console=plain -PgwmLintFast
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 ndk;29.0.14206865 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision published upstream CarPlay runtime assets
        env:
          RUNTIME_DIR: ${{ runner.temp }}/diconnect-runtime
        run: |
          python3 - <<'PY'
          import urllib.request, hashlib, zipfile, pathlib, os
          base='https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.21/'
          apk=pathlib.Path(os.environ['RUNNER_TEMP'])/'DiPlay-0.2.21.apk'
          urllib.request.urlretrieve(base+apk.name,apk)
          sums=urllib.request.urlopen(base+'SHA256SUMS.txt').read().decode()
          expected=next(line.split()[0] for line in sums.splitlines() if line.split()[-1].lstrip('*')==apk.name)
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected, 'Upstream APK checksum mismatch'
          out=pathlib.Path(os.environ['RUNTIME_DIR'])/'offline-mfi'
          out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(apk) as z:
              for n in ('identity.pk8','certificate.p7b'):
                  data=z.read('assets/offline-mfi/'+n)
                  assert data, 'Missing runtime asset'
                  (out/n).write_bytes(data)
          PY
          echo "DIPLAY_AUTH_ASSETS_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"
      # Lint on the combined ~194k-line app ran past 40 minutes with the project's 2 GB Gradle
      # heap. Lint gets its own larger heap; Gradle and the Kotlin daemon stay small enough to
      # leave room for the 2 GB Robolectric test JVM on the 16 GB runner (5 GB for both daemons
      # slowed the common tests from 7 to 23+ minutes). CI only; the project's gradle.properties
      # and lint coverage are unchanged.
      - name: Give Gradle and lint more memory on CI
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          android.experimental.lint.heapSize=6g
          PROPS
      - name: Set increasing APK revision
        run: echo "DI_CONNECT_REVISION=$(( $(date +%s) - 1767225600 ))" >> "$GITHUB_ENV"
      # One Gradle task (or a small group) per step, so the Actions page shows which one failed
      # or ran long. Later checks still run after an earlier test or lint failure, but none run
      # once the APK itself has failed to compile.
      - name: Compile preview APK
        id: compile
        timeout-minutes: 30
        run: ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :mobile:assembleDebug $GRADLE_ARGS 2>&1 | tee -a "$RUNNER_TEMP/gradle-output.log"
      - name: Check preview APK package, version and signing key
        id: apk
        run: |
          apk=$(ls mobile/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $apk"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          badging=$("$bt/aapt2" dump badging "$apk" | head -1)
          echo "$badging"
          echo "$badging" | grep -q "name='com.jollyboy95.diconnect.debug'" || { echo "::error::Wrong package ID"; exit 1; }
          code=$(echo "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          [ "$code" = "$((1000 + DI_CONNECT_REVISION))" ] || { echo "::error::Unexpected versionCode $code"; exit 1; }
          want=$(keytool -list -v -keystore mobile/gwm-debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: *//p' | tr -d ':' | tr 'A-F' 'a-f')
          got=$("$bt/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1)
          echo "Expected GWM key SHA-256: $want"; echo "APK signer SHA-256:       $got"
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::APK is not signed with mobile/gwm-debug.keystore"; exit 1; }
          echo "### Preview APK" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(basename "$apk")\` · versionCode $code · signed with the GWM development key" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Di-Connect-preview-apk
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Unit tests · shared
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 40
        run: ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :shared:testDebugUnitTest $GRADLE_ARGS 2>&1 | tee -a "$RUNNER_TEMP/gradle-output.log"
      - name: Unit tests · common (D-Play)
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 40
        run: ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :common:testDebugUnitTest $GRADLE_ARGS 2>&1 | tee -a "$RUNNER_TEMP/gradle-output.log"
      - name: Unit tests · home
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 40
        run: ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :home:testDebugUnitTest $GRADLE_ARGS 2>&1 | tee -a "$RUNNER_TEMP/gradle-output.log"
      - name: Unit tests · android-auto
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 40
        run: ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :android-auto:testDebugUnitTest $GRADLE_ARGS 2>&1 | tee -a "$RUNNER_TEMP/gradle-output.log"
      # Lint analysis runs per module and is reused by :mobile:lintDebug, so analysing the two
      # large libraries first shows which one is slow without repeating the work.
      - name: Lint analysis · android-auto
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 20
        run: ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :android-auto:lintAnalyzeDebug $GRADLE_ARGS 2>&1 | tee -a "$RUNNER_TEMP/gradle-output.log"
      - name: Lint analysis · common (D-Play)
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 20
        run: ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :common:lintAnalyzeDebug $GRADLE_ARGS 2>&1 | tee -a "$RUNNER_TEMP/gradle-output.log"
      - name: Lint · mobile
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          # Free the long-lived daemons' memory for lint's own process.
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          free -m
          ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :mobile:lintDebug $GRADLE_ARGS 2>&1 | tee -a "$RUNNER_TEMP/gradle-output.log"
      - name: Lint · home
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 40
        run: ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :home:lintDebug $GRADLE_ARGS 2>&1 | tee -a "$RUNNER_TEMP/gradle-output.log"
      - name: Lint · maphost
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 40
        run: ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :maphost:lintDebug $GRADLE_ARGS 2>&1 | tee -a "$RUNNER_TEMP/gradle-output.log"
      - name: Build home and maphost APKs
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 40
        run: ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :home:assembleDebug :maphost:assembleDebug $GRADLE_ARGS 2>&1 | tee -a "$RUNNER_TEMP/gradle-output.log"
      - name: Verify standalone CarPlay build
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 40
        run: ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :mobile:assembleStandaloneDebug $GRADLE_ARGS 2>&1 | tee -a "$RUNNER_TEMP/gradle-output.log"
      - name: Report Gradle errors and failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, re, xml.etree.ElementTree as ET
          notes = []
          log = os.path.join(os.environ['RUNNER_TEMP'], 'gradle-output.log')
          text = open(log, encoding='utf-8', errors='replace').read() if os.path.exists(log) else ''
          for line in text.splitlines():
              if re.match(r'^(e: |> Task .* FAILED|.*\bFAILED$)', line):
                  notes.append(line.strip())
          started = [line[7:].split()[0] for line in text.splitlines() if line.startswith('> Task :')]
          if started:
              notes.append('Last Gradle tasks started: ' + ', '.join(started[-12:]))
          for block in re.findall(r'\* What went wrong:\n(.*?)\n\* Try:', text, re.S):
              notes.append(' '.join(block.split())[:600])
          for report in glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      message = ' '.join((bad.get('message') or bad.text or '').split())[:400]
                      notes.append(f"{case.get('classname')}.{case.get('name')}: {message}")
          seen = []
          for note in notes:
              if note not in seen:
                  seen.append(note)
          for note in seen[:40]:
              print('::error title=Gradle::' + note.replace('%', '%25').replace('\r', '').replace('\n', ' '))
          if not seen:
              print('No Gradle error lines or failed tests found')
          PY
      - name: Report slowest Gradle tasks
        if: always()
        run: |
          python3 - <<'PY'
          import glob, html, re
          def secs(text):
              total = 0.0
              for value, unit in re.findall(r'([\d.]+)(h|m|s)', text):
                  total += float(value) * {'h': 3600, 'm': 60, 's': 1}[unit]
              return total
          tasks = {}
          for report in glob.glob('build/reports/profile/*.html'):
              page = html.unescape(open(report, encoding='utf-8', errors='replace').read())
              for task, took in re.findall(r'<td class="indentPath">(:[\w:.-]+)</td>\s*<td class="numeric">([^<]+)</td>', page):
                  tasks[task] = max(tasks.get(task, 0.0), secs(took))
          top = sorted(tasks.items(), key=lambda item: -item[1])[:12]
          lines = [f'{task}: {int(took // 60)}m {took % 60:.0f}s' for task, took in top if took >= 1]
          print('\n'.join(lines) or 'No Gradle profile found')
          if lines:
              print('::notice title=Slowest Gradle tasks::' + ' | '.join(lines))
          PY
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Di-Connect-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            common/build/reports/di-connect-home/
            **/build/reports/lint-results-debug.html
            build/reports/profile/
