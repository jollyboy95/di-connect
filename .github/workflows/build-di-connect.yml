name: Build Di-Connect APK
on:
  push:
    branches: [main, integration/android-auto]
    paths-ignore: ['_integration/**', '**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: di-connect-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 ndk;29.0.14206865 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision published upstream CarPlay runtime assets
        env:
          RUNTIME_DIR: ${{ runner.temp }}/diconnect-runtime
        run: |
          python3 - <<'PY'
          import urllib.request, hashlib, zipfile, pathlib, os
          base='https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.21/'
          apk=pathlib.Path(os.environ['RUNNER_TEMP'])/'DiPlay-0.2.21.apk'
          urllib.request.urlretrieve(base+apk.name,apk)
          sums=urllib.request.urlopen(base+'SHA256SUMS.txt').read().decode()
          expected=next(line.split()[0] for line in sums.splitlines() if line.split()[-1].lstrip('*')==apk.name)
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected, 'Upstream APK checksum mismatch'
          out=pathlib.Path(os.environ['RUNTIME_DIR'])/'offline-mfi'
          out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(apk) as z:
              for n in ('identity.pk8','certificate.p7b'):
                  data=z.read('assets/offline-mfi/'+n)
                  assert data, 'Missing runtime asset'
                  (out/n).write_bytes(data)
          PY
          echo "DIPLAY_AUTH_ASSETS_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Set increasing APK revision
        run: echo "DI_CONNECT_REVISION=$(( $(date +%s) - 1767225600 ))" >> "$GITHUB_ENV"
      - name: Compile preview APK
        run: ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :mobile:assembleDebug --stacktrace --no-configuration-cache
      - name: Unit tests, lint and source builds
        working-directory: .
        run: |
          chmod +x gradlew
          ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :android-auto:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace --no-configuration-cache
      - name: Verify standalone CarPlay build
        working-directory: .
        run: ./gradlew -PgwmRevision="$DI_CONNECT_REVISION" :mobile:assembleStandaloneDebug --stacktrace --no-configuration-cache
      - name: Preview APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Di-Connect-preview
          path: |
            mobile/build/outputs/apk/debug/*.apk
            **/build/reports/tests/
            common/build/reports/di-connect-home/
            **/build/reports/lint-results-debug.html
